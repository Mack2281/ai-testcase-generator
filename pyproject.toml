[project]
name = "testcase-generator"
version = "0.1.0"
description = "Turn a written requirement into reviewed, structured test cases with an LLM."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
testcase-generator = "testcase_generator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
